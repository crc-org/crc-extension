name: pr-check

on: [pull_request]

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install --frozen-lockfile

      - name: Run Build
        timeout-minutes: 20
        run: pnpm build

  darwin:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install

      - name: Run Build
        timeout-minutes: 20
        run: pnpm build

  lint-format-unit:
    name: linter, formatters and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install

      - name: Run linter
        run: pnpm lint:check

      - name: Run formatter
        run: pnpm format:check

      - name: Run Tests
        run: pnpm test

  e2e-tests:
    name: e2e tests for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      SKIP_INSTALLATION: true
    steps:

      - name: Checkout crc extension
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      # Download and install the Podman Desktop production binary
      - name: Install Podman Desktop
        id: podman-desktop-install
        uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@61b29597d643b5037c8d30791639ea1229829f05 # v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure getting current HEAD version of the test framework (Ubuntu/MacOS)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
        run: |
          # workaround for https://github.com/containers/podman-desktop-extension-bootc/issues/712
          version=$(npm view @podman-desktop/tests-playwright@next version)
          echo "Version of @podman-desktop/tests-playwright to be used: $version"
          jq --arg version "$version" '.devDependencies."@podman-desktop/tests-playwright" = $version' package.json > package.json_tmp && mv package.json_tmp package.json
        shell: bash

      - name: Ensure getting current HEAD version of the test framework (Windows)
        if: matrix.os == 'windows-2025'
        run: |
          # workaround for https://github.com/containers/podman-desktop-extension-bootc/issues/712
          # Install scoop installer
          Invoke-Expression (New-Object System.Net.WebClient).DownloadString('https://get.scoop.sh')
          scoop --version
          # Install jq using scoop
          scoop install jq
          # Fetch the version of the npm package
          $version = npm view @podman-desktop/tests-playwright@next version
          Write-Host "Version of @podman-desktop/tests-playwright to be used: $version"
          # Update package.json using jq
          jq --arg version "$version" '.devDependencies."@podman-desktop/tests-playwright" = $version' package.json > package.json_tmp
          # Replace the old package.json with the updated one
          Move-Item -Path package.json_tmp -Destination package.json -Force
        shell: pwsh

      - name: Revert unprivileged user namespace restrictions in Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: |
          # allow unprivileged user namespace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install OpenShift Local extension dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      # The extensions under test are the upstream `next` images, unpacked into the
      # plugins folder of the Podman Desktop home used by @podman-desktop/tests-playwright
      # (tests/playwright/output/<customFolder>, see tests/src/openshift-local-extension.spec.ts).
      - name: Install OpenShift Local extension (OCI image)
        uses: axel7083/gh-extensions-actions/.github/actions/extension-install@a6f2be2dcfbd41b4e6be6f8e6e78e2e685c72755
        with:
          image: ghcr.io/crc-org/crc-extension:next
          plugins-directory: crc-extension/tests/playwright/output/crc-tests-pd/plugins

      - name: Install Red Hat Account (SSO) extension (OCI image)
        uses: axel7083/gh-extensions-actions/.github/actions/extension-install@a6f2be2dcfbd41b4e6be6f8e6e78e2e685c72755
        with:
          image: ghcr.io/redhat-developer/podman-desktop-redhat-account-ext:next
          plugins-directory: crc-extension/tests/playwright/output/crc-tests-pd/plugins

      - name: Run All E2E tests
        working-directory: ./crc-extension
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          NODE_OPTIONS: --no-experimental-strip-types
          DEBUGGING_PORT: 9222
          PODMAN_DESKTOP_BINARY: ${{ steps.podman-desktop-install.outputs.binary }}
        run: pnpm test:e2e

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          annotate_only: true
          require_tests:  true
          report_paths: '**/*results.xml'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-tests-${{ matrix.os }}
          path: ./**/tests/**/output/
