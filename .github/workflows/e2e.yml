name: e2e

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-crc:
    name: build crc oci image
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload-crc.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build crc oci image
        run: |
          podman build -t local_image ./
          CONTAINER_ID=$(podman create localhost/local_image --entrypoint "")
          mkdir -p output/plugins
          podman export $CONTAINER_ID | tar -x -C output/plugins/
      - name: upload crc oci content
        id: upload-crc
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crc-plugin
          path: output/plugins/extension

  pull-sso:
    name: pull sso oci image
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload-sso.outputs.artifact-id }}
    steps:
      - name: pull sso oci image
        env:
          SSO_OCI_NEXT: "ghcr.io/redhat-developer/podman-desktop-redhat-account-ext:next"
        run: |
          CONTAINER_ID=$(podman create $SSO_OCI_NEXT --entrypoint "")
          mkdir -p output/plugins
          podman export $CONTAINER_ID | tar -x -C output/plugins/
      - name: upload sso oci content
        id: upload-sso
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sso-plugin
          path: output/plugins/extension

  e2e-tests:
    needs: [build-crc, pull-sso]
    name: e2e tests for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      SKIP_INSTALLATION: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Execute pnpm in CRC Extension
        run: pnpm install --no-frozen-lockfile

      - name: Ensure getting current HEAD version of the test framework
        run: pnpm --recursive update @podman-desktop/tests-playwright@next

      # Download and install the Podman Desktop production binary (Linux & Windows)
      - name: Install Podman Desktop
        id: podman-desktop-install
        uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@b3bb8515d9f255a05c0ff37ead1002435c75dcd1 # v0.3.0
        with:
          version: ${{ steps.pd-api-version.outputs.PD_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Install the crc & sso extension
      - name: download crc & sso oci image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.build-crc.outputs.artifact-id }}, ${{ needs.pull-sso.outputs.artifact-id }}"
          path: tests/playwright/output/crc-tests-pd/plugins

      - name: Run All E2E tests
        shell: bash
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          NODE_OPTIONS: --no-experimental-strip-types
          DEBUGGING_PORT: 9222
          PODMAN_DESKTOP_BINARY: ${{ steps.podman-desktop-install.outputs.binary }}
        run: pnpm test:e2e

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          annotate_only: true
          require_tests:  true
          report_paths: '**/*results.xml'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-tests-${{ matrix.os }}
          path: ./**/tests/**/output/
